<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<body>
    <!-- =========================
                    HOME HEADER
            =========================  -->
    
            <div id="header"></div>

        <!-- =========================
                        MAIN PART
            ========================= -->

        <main class="home_main">

            <div id="left-sidebar"></div>

             <!-- =========================
                     MIDDLE CONTENT START
                ========================= -->

         <div class="notification_main">

        <div class="notification_middle">

        <div class="notifications">
            <div class="notification1">
                <img src="../img/nusrat.jpg" alt="Nusrat pic" class="nusrat_pic">
                <div class="notification_time">
                    <p class="notifiy">Dr. Nusrat Jahan posted a new announcement in CSE Department.</p>

                    <p class="notify_time">1h ago</p>
                </div>
            </div>

            <div class="notification1">
               <img src="../img/MAHIR.JPG" alt="person1 pic" class="mahir_pic">
                <div class="notification_time">
                    <p class="notifiy">Mahir Hossain liked your post about the IoT project.</p>

                    <p class="notify_time">3h ago</p>
                </div>
            </div>


            <div class="notification1">
               <img src="../img/SADIA.jpg" alt="person3 pic" class="sadia_pic">
                <div class="notification_time">
                    <p class="notifiy">Sadia Jahan sent you a friend request</p>

                    <p class="notify_time">5h ago</p>
                </div>
            </div>
        

             <div class="notification1">
               <img src="../img/profile_pic.jpg" alt="Profile Picture" class="profile_pic" />
                <div class="notification_time">
                    <p class="notifiy">Your post was shared by 9 people.</p>

                    <p class="notify_time">1d ago</p>
                </div>
            </div>
        </div>   
        </div>


    </div>

            <!-- =========================
                    MIDDLE CONTENT END
                ========================= -->

             <div id="right-sidebar"></div>

        </main>


    <script src="script.js"></script>

</body>
</html>
