 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIU Social Media- Log In</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    

    <div class="logIn">
        
        <div class="left">
            <img class="logo" src="../img/logo.jpg" alt="Social media logo">
            <h1>Your campus, <br>connected.</h1>
            <p>Join thousands of UIU students and faculty. Share ideas, join clubs, attend events, and stay connected with your university community.</p>
            <footer><p>&copy; 2024 UIU Connect · All rights reserved</p></footer>
        </div>
        <div class="right">
            <div class="login_section">
                <div class="signin_createAccount">
                    <button class="Active">Sign In</button>
                    <button class="create" onclick="window.location.href='registration.html'">Create Account</button>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in with your email id and password</p>
                <form action="">
                    <label for="email">Email Address</label>
                    <input type="email" placeholder="Enter your email address">
                    <div class="pass_fgpass"><label for="password">Password</label>
                    <a href="">Forgot Password</a></div>
                    <input type="password" name="password" id="" placeholder="Enter your password">

         <button type="button" class="signIn"
                    onclick="window.location.href='home_student.html'" > Sign In
                   <button type="button" class="guest" onclick="window.location.href='guest.html'">Continue as Guest</button>
                </form>
            </div>
        </div>
    </div>
 </body>
 </html>
